<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Yuno AI Agent Orchestration{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .badge { @apply inline-flex items-center px-2 py-0.5 rounded text-xs font-medium; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-slate-900 text-white shadow">
    <div class="max-w-7xl mx-auto px-6 py-3 flex items-center gap-6">
      <a href="/" class="font-bold text-lg flex items-center gap-2">
        <span class="text-amber-400">●</span> Yuno Agents
      </a>
      <a href="/agents" class="hover:text-amber-300">Agents</a>
      <a href="/workflows" class="hover:text-amber-300">Workflows</a>
      <a href="/runs" class="hover:text-amber-300">Runs</a>
      <a href="/monitor" class="hover:text-amber-300">Live Monitor</a>
      <div class="ml-auto flex items-center gap-3 text-xs">
        <span class="px-2 py-1 rounded {% if anthropic_ok %}bg-emerald-600{% else %}bg-red-600{% endif %}">
          Claude: {% if anthropic_ok %}OK{% else %}NO KEY{% endif %}
        </span>
        <span class="px-2 py-1 rounded {% if telegram_ok %}bg-emerald-600{% else %}bg-red-600{% endif %}">
          Telegram: {% if telegram_ok %}OK{% else %}NO TOKEN{% endif %}
        </span>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6">
    {% block content %}{% endblock %}
  </main>

  <script>
    // Tiny fetch helper
    window.api = {
      async get(url) { const r = await fetch(url); if(!r.ok) throw new Error(await r.text()); return r.json(); },
      async post(url, body) { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
      async patch(url, body) { const r = await fetch(url, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
      async del(url) { const r = await fetch(url, {method:'DELETE'}); if(!r.ok && r.status !== 204) throw new Error(await r.text()); },
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
