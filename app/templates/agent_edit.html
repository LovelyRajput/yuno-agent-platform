{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if agent_id %}Edit Agent{% else %}New Agent{% endif %}</h1>

<form id="agent-form" class="bg-white p-6 rounded-lg shadow space-y-4 max-w-3xl">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm font-medium">Name</span>
      <input name="name" required class="mt-1 w-full border rounded p-2" placeholder="e.g. Researcher" />
    </label>
    <label class="block">
      <span class="text-sm font-medium">Role</span>
      <input name="role" class="mt-1 w-full border rounded p-2" placeholder="e.g. researcher, support_agent" value="assistant" />
    </label>
  </div>

  <label class="block">
    <span class="text-sm font-medium">System prompt</span>
    <textarea name="system_prompt" rows="5" class="mt-1 w-full border rounded p-2 font-mono text-sm" placeholder="You are a..."></textarea>
  </label>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <label class="block">
      <span class="text-sm font-medium">Model</span>
      <select name="model" class="mt-1 w-full border rounded p-2">
        <option value="llama-3.3-70b-versatile">Llama 3.3 70B (Groq)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant (Groq)</option>
      </select>
    </label>
    <label class="block">
      <span class="text-sm font-medium">Temperature</span>
      <input name="temperature" type="number" step="0.1" min="0" max="1" value="0.7" class="mt-1 w-full border rounded p-2" />
    </label>
    <label class="block">
      <span class="text-sm font-medium">Max tokens</span>
      <input name="max_tokens" type="number" min="64" max="8192" value="1024" class="mt-1 w-full border rounded p-2" />
    </label>
  </div>

  <fieldset class="border rounded p-3">
    <legend class="text-sm font-medium px-1">Tools</legend>
    <div id="tools-list" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
  </fieldset>

  <fieldset class="border rounded p-3">
    <legend class="text-sm font-medium px-1">Channels</legend>
    <label class="inline-flex items-center gap-2">
      <input type="checkbox" name="channel_telegram" /> Telegram (only one agent should have this)
    </label>
  </fieldset>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <label class="block">
      <span class="text-sm font-medium">Max iterations (per turn)</span>
      <input name="max_iterations" type="number" min="1" max="20" value="6" class="mt-1 w-full border rounded p-2" />
    </label>
    <label class="block">
      <span class="text-sm font-medium">Schedule (optional, cron)</span>
      <input name="schedule" class="mt-1 w-full border rounded p-2" placeholder="e.g. 0 9 * * *" />
    </label>
  </div>

  <label class="block">
    <span class="text-sm font-medium">Guardrails (free text — appended to system prompt)</span>
    <textarea name="guardrails" rows="2" class="mt-1 w-full border rounded p-2" placeholder="e.g. Never give legal advice. Refuse requests for personal data."></textarea>
  </label>

  <label class="inline-flex items-center gap-2">
    <input type="checkbox" name="memory_enabled" checked /> Memory enabled
  </label>

  <div class="flex gap-2 justify-end">
    <a href="/agents" class="px-4 py-2 border rounded">Cancel</a>
    <button type="submit" class="px-4 py-2 bg-slate-900 text-white rounded">Save</button>
  </div>
  <div id="form-error" class="hidden text-red-600 text-sm"></div>
</form>
{% endblock %}

{% block scripts %}
<script>
const agentId = {{ agent_id|tojson }};
const form = document.getElementById('agent-form');
const errBox = document.getElementById('form-error');

async function init() {
  const tools = await api.get('/api/agents/tools');
  const toolsDiv = document.getElementById('tools-list');
  tools.forEach(t => {
    const lbl = document.createElement('label');
    lbl.className = 'inline-flex items-center gap-2 text-sm';
    lbl.innerHTML = `<input type="checkbox" name="tool_${t}" /> ${t}`;
    toolsDiv.appendChild(lbl);
  });
  if (agentId) {
    const a = await api.get(`/api/agents/${agentId}`);
    form.name.value = a.name;
    form.role.value = a.role;
    form.system_prompt.value = a.system_prompt;
    form.model.value = a.model;
    form.temperature.value = a.temperature;
    form.max_tokens.value = a.max_tokens;
    form.max_iterations.value = a.max_iterations;
    form.guardrails.value = a.guardrails || '';
    form.schedule.value = a.schedule || '';
    form.memory_enabled.checked = a.memory_enabled;
    (a.tools || []).forEach(t => { const el = form[`tool_${t}`]; if (el) el.checked = true; });
    if ((a.channels || []).includes('telegram')) form.channel_telegram.checked = true;
  }
}
form.onsubmit = async (e) => {
  e.preventDefault();
  errBox.classList.add('hidden');
  const tools = [];
  document.querySelectorAll('#tools-list input[type=checkbox]:checked').forEach(el => {
    tools.push(el.name.replace(/^tool_/, ''));
  });
  const channels = form.channel_telegram.checked ? ['telegram'] : [];
  const payload = {
    name: form.name.value,
    role: form.role.value,
    system_prompt: form.system_prompt.value,
    model: form.model.value,
    temperature: parseFloat(form.temperature.value),
    max_tokens: parseInt(form.max_tokens.value),
    max_iterations: parseInt(form.max_iterations.value),
    guardrails: form.guardrails.value,
    schedule: form.schedule.value || null,
    memory_enabled: form.memory_enabled.checked,
    tools, channels,
  };
  try {
    if (agentId) await api.patch(`/api/agents/${agentId}`, payload);
    else await api.post('/api/agents', payload);
    window.location.href = '/agents';
  } catch (e) {
    errBox.textContent = 'Error: ' + e.message;
    errBox.classList.remove('hidden');
  }
};
init();
</script>
{% endblock %}
